<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>список задач</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
</head>
<body>
    <div class="container"> 
    <h1>список задач</h1>
    <form method="post">
    <input type="text" placeholder="введите название задачи" name="task">
    <button type="submit">+</button>
    </form>
    <ul>
    {% if not tasks %}
    Задач пока нет. Нажмите + чтобы добавить задачу 
    {% else %} 
    {% for task in tasks %}
    <li><span> {{ task }} </span>
        <div>
        <a href="{{ url_for('edit_task',index=loop.index0) }}" class="edit-button">✏️</a>
    <a href="{{ url_for('delete_task',index=loop.index0) }}" class="delete-button">🗑️</a>
</div>    
</li>

    {% endfor %}
    {% endif %}
    </ul>
    </div> 
</body>
</html>
